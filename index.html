<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stock Animation by Keith Li</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-state="loading">
    <div class="app">
      <header class="bar">
        <h1 class="mark">Stock Animation by Keith Li</h1>
        <div class="subject">
          <form id="form">
            <label for="ticker">Ticker</label>
            <input
              id="ticker"
              name="ticker"
              value="NVDA"
              autocomplete="off"
              spellcheck="false"
              placeholder="NVDA, AAPL, 0700.HK"
              aria-describedby="cue"
            />
            <p id="cue" class="cue">Any US or Hong Kong stock, e.g. NVDA, AAPL, 0700.HK, then press Enter</p>
          </form>
          <div class="segment lookback" role="radiogroup" aria-label="Lookback range" data-lookback>
            <button type="button" role="radio" data-span="1y" aria-checked="false" tabindex="-1">1Y</button>
            <button type="button" role="radio" data-span="3y" aria-checked="false" tabindex="-1">3Y</button>
            <button type="button" role="radio" data-span="5y" aria-checked="true" tabindex="0">5Y</button>
          </div>
        </div>
      </header>
      <div class="player">
        <div class="film">
          <canvas id="stage" width="1920" height="1080"></canvas>
          <p class="share">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                d="M8 2.75v6.5M4.9 6.9 8 10l3.1-3.1M3.25 13.25h9.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="share-copy">Download the MP4 when the film ends and <span class="share-act">share it on social media</span>.</span>
          </p>
        </div>
        <div class="dock" role="group" aria-label="Playback">
          <button id="play" type="button">
            <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M5.4 3.05 12.55 8 5.4 12.95Z" fill="currentColor" />
            </svg>
            <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true" focusable="false" hidden>
              <path d="M4.2 3h2.35v10H4.2zm5.25 0H11.8v10H9.45z" fill="currentColor" />
            </svg>
            <span class="play-label">Play</span>
          </button>
          <button id="replay" type="button" hidden>Replay</button>
          <div class="segment speed" role="radiogroup" aria-label="Playback speed" data-speed>
            <button type="button" role="radio" data-rate="0.5" aria-checked="false" tabindex="-1">0.5x</button>
            <button type="button" role="radio" data-rate="1" aria-checked="true" tabindex="0">1x</button>
            <button type="button" role="radio" data-rate="1.5" aria-checked="false" tabindex="-1">1.5x</button>
            <button type="button" role="radio" data-rate="2" aria-checked="false" tabindex="-1">2x</button>
          </div>
          <div class="outcome">
            <button id="download" type="button" hidden>Download MP4</button>
          </div>
        </div>
      </div>
      <p id="status" role="status">Loading NVDA…</p>
      <footer class="colophon">
        <a href="https://www.linkedin.com/in/keithlihk">Created by Keith Li · Follow me on LinkedIn</a>
        <span class="sep" aria-hidden="true">·</span>
        <a href="https://github.com/keithligh/stock-animation">Source on GitHub</a>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
